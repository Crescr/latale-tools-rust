name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build CLI tools
        run: |
          cargo build --release --locked `
            --bin latale-spf `
            --bin latale-ldt `
            --bin latale-stg

      - name: Build NSIS and MSI installers
        working-directory: gui
        run: npm run tauri build

      - name: Verify Windows metadata
        shell: pwsh
        run: |
          $version = (Get-Content gui/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version v$version"
          }

          $executables = @(
            @{ Path = "target/release/latale-spf.exe"; ContactField = "Comments" },
            @{ Path = "target/release/latale-ldt.exe"; ContactField = "Comments" },
            @{ Path = "target/release/latale-stg.exe"; ContactField = "Comments" },
            @{ Path = "gui/src-tauri/target/release/latale-tools.exe"; ContactField = "LegalCopyright" }
          )

          foreach ($executable in $executables) {
            $metadata = (Get-Item $executable.Path).VersionInfo
            if ($metadata.CompanyName -ne "元气君") {
              throw "$($executable.Path) has an unexpected CompanyName"
            }
            if (-not $metadata.ProductVersion.StartsWith($version)) {
              throw "$($executable.Path) has ProductVersion $($metadata.ProductVersion), expected $version"
            }
            if (-not $metadata.FileVersion.StartsWith($version)) {
              throw "$($executable.Path) has FileVersion $($metadata.FileVersion), expected $version"
            }
            $contact = $metadata.($executable.ContactField)
            if ($contact -notmatch "915994204") {
              throw "$($executable.Path) does not contain the QQ contact metadata"
            }
          }

      - name: Stage release files
        shell: pwsh
        run: |
          $version = (Get-Content gui/package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release-artifacts | Out-Null

          Copy-Item `
            gui/src-tauri/target/release/latale-tools.exe `
            "release-artifacts/latale-tools-$version-windows-x64.exe"
          Copy-Item `
            target/release/latale-spf.exe `
            "release-artifacts/latale-spf.exe"
          Copy-Item `
            target/release/latale-ldt.exe `
            "release-artifacts/latale-ldt.exe"
          Copy-Item `
            target/release/latale-stg.exe `
            "release-artifacts/latale-stg.exe"

          $nsis = Get-ChildItem gui/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          $msi = Get-ChildItem gui/src-tauri/target/release/bundle/msi/*.msi |
            Select-Object -First 1
          if (-not $nsis -or -not $msi) {
            throw "NSIS or MSI installer was not generated"
          }

          Copy-Item $nsis.FullName `
            "release-artifacts/latale-tools-$version-windows-x64-setup.exe"
          Copy-Item $msi.FullName `
            "release-artifacts/latale-tools-$version-windows-x64.msi"
          Copy-Item docs/latale-spf-guide.md release-artifacts/
          Copy-Item docs/latale-ldt-guide.md release-artifacts/
          Copy-Item docs/latale-stg-guide.md release-artifacts/

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: latale-tools-windows-x64
          if-no-files-found: error
          path: release-artifacts/*

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem release-artifacts -File |
              ForEach-Object { $_.FullName }
          )
          $notes = @'
          ## 下载说明

          - 普通用户建议下载 NSIS 安装程序（文件名以 `-setup.exe` 结尾）。
          - `latale-tools-*.exe` 是免安装 GUI。
          - `latale-spf.exe`、`latale-ldt.exe`、`latale-stg.exe` 是命令行工具。

          仅支持 Windows x64。提需求和 Bug：QQ: 915994204。
          '@
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title "LaTale Tools $env:GITHUB_REF_NAME" `
            --notes $notes `
            --generate-notes
